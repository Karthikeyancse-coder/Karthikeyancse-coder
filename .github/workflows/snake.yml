name: Generate GitHub Stats and Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Create output directory
        run: mkdir -p output-files

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Karthikeyancse-coder
          outputs: |
            output-files/github-snake.svg
            output-files/github-snake-dark.svg?palette=github-dark

      - name: Fetch Stats and Langs SVGs
        run: |
          STAT_URLS=(
            "https://github-readme-stats.vercel.app/api?username=Karthikeyancse-coder&show_icons=true&theme=radical&hide_border=true&bg_color=0D1117&title_color=FF6B6B&icon_color=FFC857&text_color=FFFFFF&border_radius=15&include_all_commits=true&count_private=true"
            "https://github-readme-stats-sigma-five.vercel.app/api?username=Karthikeyancse-coder&show_icons=true&theme=radical&hide_border=true&bg_color=0D1117&title_color=FF6B6B&icon_color=FFC857&text_color=FFFFFF&border_radius=15&include_all_commits=true&count_private=true"
            "https://github-readme-stats-git-master-gruberdev.vercel.app/api?username=Karthikeyancse-coder&show_icons=true&theme=radical&hide_border=true&bg_color=0D1117&title_color=FF6B6B&icon_color=FFC857&text_color=FFFFFF&border_radius=15&include_all_commits=true&count_private=true"
          )
          for url in "${STAT_URLS[@]}"; do
            curl -s --max-time 30 "$url" -o output-files/stats.svg
            if grep -q "<svg" output-files/stats.svg; then
              echo "stats.svg OK"; break
            fi
            echo "Failed, trying next mirror..."; sleep 5
          done

          LANG_URLS=(
            "https://github-readme-stats.vercel.app/api/top-langs/?username=Karthikeyancse-coder&layout=compact&theme=radical&hide_border=true&bg_color=0D1117&title_color=4ECDC4&text_color=FFFFFF&border_radius=15&langs_count=8"
            "https://github-readme-stats-sigma-five.vercel.app/api/top-langs/?username=Karthikeyancse-coder&layout=compact&theme=radical&hide_border=true&bg_color=0D1117&title_color=4ECDC4&text_color=FFFFFF&border_radius=15&langs_count=8"
            "https://github-readme-stats-git-master-gruberdev.vercel.app/api/top-langs/?username=Karthikeyancse-coder&layout=compact&theme=radical&hide_border=true&bg_color=0D1117&title_color=4ECDC4&text_color=FFFFFF&border_radius=15&langs_count=8"
          )
          for url in "${LANG_URLS[@]}"; do
            curl -s --max-time 30 "$url" -o output-files/langs.svg
            if grep -q "<svg" output-files/langs.svg; then
              echo "langs.svg OK"; break
            fi
            echo "Failed, trying next mirror..."; sleep 5
          done

      - name: Deploy all to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./output-files
          keep_files: true
          commit_message: "ci: update stats and snake"
